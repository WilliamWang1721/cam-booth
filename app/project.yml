name: CamBooth
options:
  bundleIdPrefix: app.cambooth
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  CamBooth:
    type: application
    platform: macOS
    sources:
      - CamBooth/Sources
    info:
      path: CamBooth/Info.plist
      properties:
        CFBundleDisplayName: Cam Booth
        LSApplicationCategoryType: public.app-category.photography
        NSCameraUsageDescription: Cam Booth 需要使用摄像头来拍照和录像。
        NSMicrophoneUsageDescription: Cam Booth 需要使用麦克风为视频录制声音。
    entitlements:
      path: CamBooth/CamBooth.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cambooth.CamBooth
        PRODUCT_NAME: Cam Booth
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OBJC_BRIDGING_HEADER: CamBooth/Sources/CamBooth-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../core/target/universal
        OTHER_LDFLAGS: -lcambooth_core
